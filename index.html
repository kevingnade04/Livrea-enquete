function mountPage(q,priorPage,priorScroll,forcedScroll){const vp=$('#viewport'),wrap=$('#image-wrap'),v=variant(q.page);if(CONFIG.LIVE_VERKENNING&&q.type!=='attention'&&!(q.type==='click'&&selectionMode)){wrap.classList.add('live-wrap');wrap.innerHTML=`<iframe class="live-site" title="LIVREA — vrij verkennen" sandbox="allow-scripts allow-same-origin allow-forms" src="${esc(CONFIG.pages[q.page].url)}" referrerpolicy="no-referrer" allow="fullscreen"></iframe>`;vp.classList.add('live-viewport');bindNavigation(q);if($('.study')?.classList.contains('website-expanded')){$('#expand-site').textContent='← Terug naar vragen';$('#expand-site').setAttribute('aria-expanded','true')}return}wrap.classList.remove('live-wrap');vp.classList.remove('live-viewport');wrap.innerHTML=`<img class="site-image" id="site-image" src="${esc(v.src)}" alt="${esc(CONFIG.pages[q.page].title)}" draggable="false">`;const image=$('#site-image');let loaded=false;image.onload=()=>{if(loaded||!image.isConnected)return;loaded=true;vp.scrollTop=forcedScroll??(priorPage===q.page?priorScroll:state.sitePositions?.[q.page]||0);if(q.type==='attention'){if(!state.answers[q.id]&&!$('.point-hint')){const hint=document.createElement('div');hint.className='point-hint';hint.setAttribute('aria-hidden','true');hint.textContent='Klik op wat als eerste opvalt · er opent niets';$('.browser')?.appendChild(hint)}questionAt=performance.now();if(!state.answers.Q14)state.answers.Q14_WEERGAVE=attentionView()}trackView(q.page);drawSelected(q);if(q.type!=='attention')mountLinks(q)};if(image.complete)image.onload();vp.onscroll=()=>{trackView(q.page);state.sitePositions??={};state.sitePositions[q.page]=vp.scrollTop;persist()};vp.onwheel=()=>animationId++;vp.ontouchstart=()=>animationId++;vp.onkeydown=e=>{if(['PageDown','PageUp','Home','End','ArrowDown','ArrowUp',' '].includes(e.key))animationId++};if(q.type==='click'&&selectionMode||q.type==='attention')bindClick(q);bindNavigation(q)}

function navigateSite(page,section=null,back=false,position){if(!CONFIG.pages[page]||current().type==='exposure')return;const from=currentPage,scroll=$('#viewport')?.scrollTop||0;if(from){state.sitePositions??={};state.sitePositions[from]=scroll;if(!back)siteHistory.push({page:from,scroll})}currentPage=page;const q={...current(),page};$('.browser').outerHTML=browserHTML(q);mountPage(q,from,scroll,position);if(section&&$('#site-image')){const im=$('#site-image'),target=variant(page).sections.find(s=>s.id===section);const jump=()=>{if(target&&im.isConnected)smoothScroll($('#viewport'),target.start/100*im.clientHeight,()=>trackView(page))};if(im.complete)jump();else im.addEventListener('load',jump,{once:true})}persist()}

function smoothScroll(el,target,done){const id=++animationId,from=el.scrollTop,start=performance.now();target=Math.min(target,el.scrollHeight-el.clientHeight);if(reduced){el.scrollTop=target;done?.();return}function step(t){if(id!==animationId)return;const p=Math.min((t-start)/900,1),ease=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;el.scrollTop=from+(target-from)*ease;if(p<1)requestAnimationFrame(step);else done?.()}requestAnimationFrame(step)}

function bindClick(q){const vp=$('#viewport');let keypos=null;vp.onclick=e=>{if(q.type==='attention'&&state.answers[q.id])return;const im=$('#site-image');if(!im||!im.naturalWidth)return;const r=im.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(x>=0&&x<=100&&y>=0&&y<=100)recordClick(q,x,y,'pointer')};vp.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(e.key))return;if(q.type==='attention'&&state.answers[q.id])return;e.preventDefault();const im=$('#site-image');if(!im)return;if(!keypos)keypos={x:50,y:(vp.scrollTop+vp.clientHeight/2)/im.clientHeight*100};const step=e.shiftKey?1:.25;if(e.key==='ArrowLeft')keypos.x-=step;if(e.key==='ArrowRight')keypos.x+=step;if(e.key==='ArrowUp')keypos.y-=step;if(e.key==='ArrowDown')keypos.y+=step;keypos.x=Math.max(0,Math.min(100,keypos.x));keypos.y=Math.max(0,Math.min(100,keypos.y));if(e.key==='Enter'||e.key===' ')recordClick(q,keypos.x,keypos.y,'keyboard');else{dot(keypos.x,keypos.y,true);const py=keypos.y/100*im.clientHeight;if(py<vp.scrollTop||py>vp.scrollTop+vp.clientHeight)vp.scrollTop=py-vp.clientHeight/2}}}
function recordClick(q,x,y,method){if(state.clicks.length>=CONFIG.limits.clicks)return;if(q.type==='attention'&&state.clicks.some(c=>c.VRAAG===q.id))return;const ms=Math.round(performance.now()-questionAt);state.clicks.filter(c=>c.VRAAG===q.id).forEach(c=>c.GESELECTEERD=0);state.clicks.push({KLIK_ID:uid(),VRAAG:q.id,PAGINA:q.page,SECTIE:sectionAt(q.page,y),X:Math.round(x*10000)/10000,Y:Math.round(y*10000)/10000,MS:ms,GEVONDEN:null,GESELECTEERD:1,INPUT_METHOD:method});state.answers[q.id]=1;if(q.type!=='attention')state.answers[q.id+'_ANDERS']=0;state.answers[q.id+'_X']=x;state.answers[q.id+'_Y']=y;state.answers[q.id+'_MS']=ms;state.answers[q.id+'_PAGINA']=q.page;if(q.id==='Q18'){state.answers.Q18_GEEN=0;$('#noattraction')?.setAttribute('aria-pressed','false')}if(q.noLeave){state.answers.Q19_NIET_AFHAKEN=0;state.answers.Q19_SECTIE=sectionAt(q.page,y);$('#noleave')?.setAttribute('aria-pressed','false')}if(q.type==='attention'){const vp=$('#viewport'),im=$('#site-image');state.answers[q.id+'_GESCROLD']=vp&&vp.scrollTop>20?1:0;state.answers[q.id+'_SCROLL_PCT']=vp&&im&&im.clientHeight?Math.round(vp.scrollTop/im.clientHeight*1000)/10:0;$('.point-hint')?.remove()}dot(x,y);$('.attention-study')?.classList.add('has-selection');if(q.type==='attention'&&matchMedia('(max-width:800px)').matches)$('.attention-study .panel')?.scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'});$('#click-status').textContent=q.type==='attention'?attentionText(q):chosenText(q);if(q.type==='click'){$('.click-study')?.classList.add('has-selection');if(matchMedia('(max-width:800px)').matches&&!$('.study')?.classList.contains('website-expanded'))setTimeout(()=>$('.click-study .panel')?.scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'}),350);['#noattraction','#noleave','#other-page'].forEach(s=>$(s)?.setAttribute('aria-pressed','false'))}changed();if(q.type==='click'&&$('.study')?.classList.contains('website-expanded'))setTimeout(()=>{if($('.study')?.classList.contains('website-expanded'))toggleWebsiteView();$('#next')?.scrollIntoView({block:'center',behavior:reduced?'auto':'smooth'})},650)}
function derive(){const a=state.answers,hr=['1','2'].includes(a.Q04),r={RESPONDENT_ID:state.id,VERSIE:CONFIG.VERSION,TEST:state.test,CONDITIE:state.condition,DEVICE:state.device,STARTTIJD:state.started,EINDTIJD:state.ended,TOTALE_DUUR_SEC:Math.round(((state.complete?Date.parse(state.ended):Date.now())-Date.parse(state.started))/100)/10,ACTIEVE_DUUR_SEC:Math.round(state.activeMs/100)/10,SCHERMBREEDTE:state.screenWidth,BROWSER:state.browser,AFGEROND:state.complete?1:0,LAATSTE_VRAAG:state.last,SEGMENT:a.Q04?(hr?1:2):null,DOELGROEP:a.Q04?(hr&&['2','3'].includes(a.Q06)?1:0):null,MAX_SCROLL_HOME:state.scroll.home,MAX_SCROLL_PRODUCT:state.scroll.product,GEZIENE_SECTIES:state.seen.join('|'),TOESTEMMING:1};Object.entries(a).forEach(([k,v])=>{if(!Array.isArray(v))r[k]=v});CONFIG.questions.filter(q=>q.type==='multi').forEach(q=>{if(a[q.id])q.options.forEach(([code])=>r[q.prefix+code]=a[q.id].includes(code)?1:0)});Object.keys(CONFIG.blocks).forEach(b=>r['TIJD_BLOK_'+b+'_SEC']=Math.round((state.blockMs[b]||0)/100)/10);if(a.Q04)r.PERSPECTIEF=perspective(a.Q04);if(a.Q04)r.BESLISSER=a.Q04==='3'||(a.Q04==='1'&&a.Q05==='1')?1:0;{const mq=CONFIG.questions.find(q=>q.type==='matrix'),vals=mq.rows.map(x=>a[x[0]]).filter(Number.isInteger);if(vals.length===mq.rows.length){r.TO_BELANG_GEM=Math.round(vals.reduce((s,v)=>s+v,0)/vals.length*100)/100;if(Number.isInteger(a.Q09))r.TO_GAP=Math.round((r.TO_BELANG_GEM-a.Q09)*100)/100}}if(a.Q24!==undefined)r.NPS_GROEP=a.Q24<=6?1:a.Q24<=8?2:3;if(a.Q23!==undefined&&a.Q26!==undefined)r.USP_EFFECT=a.Q26-a.Q23;r.SNELHEID_VLAG=state.complete&&r.TOTALE_DUUR_SEC<CONFIG.limits.minimumDuration?1:0;r.BRON=state.source||'';Object.assign(r,qualityFlags(r));return r}

function jsonp(args){return new Promise((resolve,reject)=>{if(!CONFIG.APPS_SCRIPT_URL)return reject(new Error('Geen opslag-URL'));const name='cb_'+uid().replaceAll('-','');const s=document.createElement('script');let timeout;const clean=()=>{clearTimeout(timeout);s.remove();delete window[name]};window[name]=data=>{clean();resolve(data)};s.onerror=()=>{clean();reject(new Error('Geen verbinding met opslag'))};timeout=setTimeout(()=>{clean();reject(new Error('Opslag reageert niet'))},18000);const u=new URL(CONFIG.APPS_SCRIPT_URL);Object.entries({...args,callback:name}).forEach(([k,v])=>u.searchParams.set(k,String(v)));s.referrerPolicy='no-referrer';s.src=u.href;document.head.appendChild(s)})}
async function sendPending(){if(!state?.pending||saving||!CONFIG.APPS_SCRIPT_URL){updateStatus();return}saving=true;updateStatus();const payload=state.pending;try{await fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload),keepalive:JSON.stringify(payload).length<60000,credentials:'omit',referrerPolicy:'no-referrer'});const ack=await jsonp({action:'status',id:state.id,receipt:state.receipt});if(!ack.ok||ack.seq<payload.seq)throw new Error('Nog niet bevestigd');state.acked=Math.max(state.acked,ack.seq);retryCount=0;if(state.pending?.seq<=state.acked)state.pending=null;persist()}catch{retryCount++}finally{saving=false;updateStatus();if(state.pending)setTimeout(sendPending,Math.min(60000,CONFIG.limits.retryMs*Math.max(1,retryCount)))}}

function buildSchema(){const f={},book=[];function add(code,text,type='number',values=null,min=0,max=1e9){f[code]={type,values,min,max,maxLength:CONFIG.limits.text,integer:type==='number'&&!!values};book.push({CODE:code,VRAAGTEKST:text,TYPE:type,WAARDEN:values?JSON.stringify(values):''})}const meta={RESPONDENT_ID:'Willekeurige respondentcode',VERSIE:'Onderzoeksversie',STARTTIJD:'Starttijd UTC (ISO)',EINDTIJD:'Eindtijd UTC (ISO)',BROWSER:'Browserfamilie',LAATSTE_VRAAG:'Laatst bereikt scherm; geen bewezen afhaaksectie',GEZIENE_SECTIES:'Daadwerkelijk getoonde secties, gescheiden door |'};Object.entries(meta).forEach(([k,v])=>add(k,v,'text'));['TEST','CONDITIE','DEVICE','SEGMENT','DOELGROEP','NPS_GROEP'].forEach(k=>add(k,k,k==='DEVICE'?'text':'number',CONFIG.labels[k]));['TOESTEMMING','AFGEROND','SNELHEID_VLAG','RECHTE_LIJN_MATRIX','RECHTE_LIJN_GEVOEL','KWALITEIT_VLAG','Q14_GESCROLD','Q19_NIET_AFHAKEN','Q18_GEEN','Q18_ANDERS','Q19_ANDERS','KAART_GEZIEN'].forEach(k=>add(k,k,'number',{'0':'Nee','1':'Ja'},0,1));['TOTALE_DUUR_SEC','ACTIEVE_DUUR_SEC','SCHERMBREEDTE'].forEach(k=>add(k,k));['MAX_SCROLL_HOME','MAX_SCROLL_PRODUCT'].forEach(k=>add(k,'Maximale zichtbare onderrand, inclusief automatische scroll','number',null,0,100));Object.keys(CONFIG.blocks).forEach(k=>add('TIJD_BLOK_'+k+'_SEC','Actieve tijd blok '+k));CONFIG.questions.forEach(q=>{if(q.type==='multi')q.options.forEach(([code,label])=>add(q.prefix+code,q.text+' — '+label,'number',{'0':'Niet gekozen','1':'Gekozen'},0,1));else if(q.type==='semantic')q.rows.forEach(([code,l,r])=>{add(code,q.text+' '+l+' – '+r,'number',null,1,5);f[code].integer=true;});else if(q.type==='matrix'){q.rows.forEach(([code,l])=>{add(code,'Belang talentontwikkeling — '+l+' (1 niet belangrijk – 5 zeer belangrijk)','number',null,1,5);f[code].integer=true});add(q.perspective,'Perspectief van Q07/Q08 (afgeleid uit Q04): organisatie, eigen werk of (toekomstig) werk','number',CONFIG.labels[q.perspective],1,3)}else if(q.type==='memory'){const vals={'99':q.none[1]};Object.values(CONFIG.pages).forEach(p=>Object.values(p).filter(v=>v?.sections).forEach(v=>v.sections.forEach(s=>vals[s.id]=s.label)));add('MEEST_BIJGEBLEVEN',q.text,'text',vals)}else if(['click','attention'].includes(q.type)){add(q.id,q.text,'number',{'1':'Afgerond'},1,1);add(q.id+'_X','Klik x%, volledige afbeelding','number',null,0,100);add(q.id+'_Y','Klik y%, volledige afbeelding','number',null,0,100);add(q.id+'_MS','Tijd tot geselecteerde klik (ms)');add(q.id+'_PAGINA','Pagina van de geselecteerde klik','text',{home:'Homepage',product:'Productpagina'})}else if(q.type==='scale'){add(q.id,q.text,'number',null,q.min,q.max);f[q.id].integer=true;}else if(q.type==='open')add(q.variable||q.id,q.text,'text');else add(q.id,q.text,'text',Object.fromEntries(q.options.map(x=>[x[0],x[1]])));if(q.comment)add(q.comment,q.text+' — toelichting','text')});add('Q14_WEERGAVE','Weergave bij de eerste klik','text',{compact:'Overzicht (verkleind)',breedte:'Groot (volle breedte)',overzicht:'Hele pagina'});add('Q19_SECTIE','Aangewezen afhaaksectie; geen werkelijk vertrek','text');add('BESLISSER','Beslisser (directie, of HR met leiding/management als taak)','number',{'0':'Nee','1':'Ja'},0,1);add('BRON','Wervingskanaal uit de link (?bron=…), leeg als onbekend','text');add('Q14_SCROLL_PCT','Scrollpositie bij de eerste klik (% van de pagina); 0 = bovenaan','number',null,0,100);add('TO_BELANG_GEM','Gemiddeld belang van de onderdelen van talentontwikkeling (Q08, 1–5)','number',null,1,5);add('TO_GAP','Behoeftekloof: TO_BELANG_GEM − Q09 tevredenheid (positief = belangrijker dan tevreden)','number',null,-4,4);add('USP_EFFECT','Q26 − Q23; verandering in uitgesproken intentie','number',null,-4,4);book.push({CODE:'KLIKS',VRAAGTEKST:'Alle pogingen, GESELECTEERD=1 voor laatste bevestigde selectie; Q14 eerste klik. DEVICE nooit mengen.',TYPE:'dataset',WAARDEN:'X/Y 0–100; MS vanaf zichtbaar worden van de opname/vraag; GEVONDEN is leeg; geen goed/fout-score; INPUT_METHOD pointer/keyboard'});return {version:CONFIG.VERSION,fields:f,codebook:book,limits:CONFIG.limits,controlGroup:CONFIG.CONTROLEGROEP_AAN,questions:CONFIG.questions.map(q=>({id:q.id,type:q.type,page:q.page,variable:q.variable,correct:q.correct,options:q.options,rows:q.rows?q.rows.map(r=>r[0]):undefined,prefix:q.prefix,onlyHR:q.onlyHR,audience:q.audience,autoValue:q.autoValue,skipStudent:q.skipStudent,exclusive:q.exclusive,max:q.max,minLength:q.minLength})),targets:Object.fromEntries(Object.entries(CONFIG.pages.home).filter(([k,v])=>v?.targets).map(([k,v])=>[k,v.targets])),sections:Object.fromEntries(['desktop','mobile'].map(d=>[d,Object.fromEntries(Object.entries(CONFIG.pages).map(([p,v])=>[p,v[d].sections]))]))}}

/* ---------------- INZICHTEN PER DEELVRAAG ---------------- */
function insightsHTML(rows){
 const Q=id=>CONFIG.questions.find(q=>q.id===id),done=rows.filter(r=>Number(r.AFGEROND)===1);
 const pct=(rs,f)=>{const a=rs.filter(f);return rs.length?Math.round(100*a.length/rs.length):null};
 const top2=(rs,k)=>{const v=rs.filter(r=>has(r,k));return v.length?Math.round(100*v.filter(r=>Number(r[k])>=4).length/v.length)+'%':'—'};
 const cell=v=>v===null||v===undefined?'—':v;
 const groups=[['Alle',r=>true],['HR',r=>Number(r.SEGMENT)===1],['Beslisser',r=>Number(r.BESLISSER)===1],['Overig',r=>Number(r.SEGMENT)===2]];
 const table=(head,body)=>`<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(x=>`<td>${esc(cell(x))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 const optDist=(q,rs,key=q.id)=>q.options.filter(o=>!(q.hiddenOptions||[]).includes(o[0])).map(o=>{const v=rs.filter(r=>r[key]!==undefined&&r[key]!==''&&r[key]!==null);return [o[1],v.filter(r=>String(r[key])===o[0]).length,v.length?Math.round(100*v.filter(r=>String(r[key])===o[0]).length/v.length)+'%':'—']}).sort((a,b)=>b[1]-a[1]);
 const multiDist=q=>q.options.filter(o=>!(q.hiddenOptions||[]).includes(o[0])).map(o=>{const v=rows.filter(r=>q.options.some(x=>Number(r[q.prefix+x[0]])===1)&&Number(r[q.prefix+(q.autoValue||'8')])!==1);return [o[1],v.length?Math.round(100*v.filter(r=>Number(r[q.prefix+o[0]])===1).length/v.length)+'%':'—']}).sort((a,b)=>parseInt(b[1])-parseInt(a[1])||0);
 const m=CONFIG.questions.find(q=>q.type==='matrix'),sem=CONFIG.questions.find(q=>q.type==='semantic');
 const persp=[1,2,3].map(p=>rows.filter(r=>Number(r.PERSPECTIEF)===p));
 const sections=(qid)=>{const c={};filteredClicks().filter(k=>k.VRAAG===qid).forEach(k=>{const v=CONFIG.pages[k.PAGINA][getFilters().device].sections.find(s=>s.id===k.SECTIE);const l=(v?v.label:k.SECTIE)+' · '+(k.PAGINA==='home'?'home':'product');c[l]=(c[l]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5)};
 const msMed=(()=>{const v=filteredClicks().filter(k=>k.VRAAG==='Q14').map(k=>Number(k.MS)).sort((a,b)=>a-b);return v.length?fmt(v[Math.floor(v.length/2)]/1000)+' s':'—'})();
 return `<section class="panel insights" style="margin-top:20px"><h2>Inzichten per deelvraag</h2><p class="muted">Huidige filters gelden. Afgerond: ${done.length} van ${rows.length}. Schalen 1–5: gemiddelde en % 4–5. Kleine aantallen beschrijvend rapporteren.</p>
 <h3>1 · Behoefte bij organisaties</h3>
 ${table(['Onderdeel talentontwikkeling (Q08)','Organisatie','Eigen werk','(Toekomstig) werk','Alle'],m.rows.map(([k,l])=>[l,...persp.map(rs=>fmt(mean(rs,k))),fmt(mean(rows,k))]).sort((a,b)=>parseFloat(String(b[4]).replace(',','.'))-parseFloat(String(a[4]).replace(',','.'))))}
 ${table(['','Organisatie','Eigen werk','(Toekomstig) werk'],[['Tevredenheid huidige aanpak (Q09)',...persp.map(rs=>fmt(mean(rs,'Q09')))],['Behoeftekloof TO_GAP',...persp.map(rs=>fmt(mean(rs,'TO_GAP')))]])}
 ${table(['Wat doet de organisatie (Q07)','%'],multiDist(Q('Q07')).slice(0,6))}
 <h3>2 · Oriëntatie op HR-software</h3>
 ${table(['Waar als eerste zoeken (Q11)','n','%'],optDist(Q('Q11'),rows))}
 ${table(['Naamsbekendheid (Q12)','%'],multiDist(Q('Q12')))}
 ${table(['Groep','Belang website voor eerste indruk (Q13)','% 4–5'],groups.map(([n,f])=>[n,fmt(mean(rows.filter(f),'Q13')),top2(rows.filter(f),'Q13')]))}
 <h3>3 · Eerste indruk</h3>
 ${table(['Groep','Duidelijk aanbod (Q15)','% 4–5','Eerste indruk (Q16)','% 4–5'],groups.map(([n,f])=>{const rs=rows.filter(f);return [n,fmt(mean(rs,'Q15')),top2(rs,'Q15'),fmt(mean(rs,'Q16')),top2(rs,'Q16')]}))}
 <p class="muted">Eerste klik: mediane tijd ${msMed}; ${cell(pct(rows.filter(r=>has(r,'Q14_GESCROLD')),r=>Number(r.Q14_GESCROLD)===1))}% scrolde eerst. Zie de heatmap hieronder.</p>
 ${table(['Meest aangewezen bij eerste klik (Q14)','Aantal'],sections('Q14'))}
 <h3>4 · Beleving en klantreis</h3>
 ${table(['Gevoel (Q17), 1 = links, 5 = rechts','HR','Overig','Alle'],sem.rows.map(([k,l,r])=>[l+' → '+r,fmt(mean(rows.filter(groups[1][1]),k)),fmt(mean(rows.filter(groups[3][1]),k)),fmt(mean(rows,k))]))}
 ${table(['Nodigt uit om verder te kijken (Q18)','Aantal'],sections('Q18'))}
 ${table(['Afhaakpunt (Q19)','Aantal'],sections('Q19'))}
 ${table(['Waar draait LIVREA om? (Q21)','n','%'],optDist(Q('Q21'),rows))}
 <p class="muted">Voor wie bedoeld (Q20): ${fmt(mean(rows,'Q20'))} · % 4–5 ${top2(rows,'Q20')}.</p>
 <h3>5 · Intentie en onderbouwing</h3>
 ${table(['Groep','Contactintentie (Q23)','Aanbeveling 0–10 (Q24)','Intentie na kaart (Q26)','Verandering'],groups.map(([n,f])=>{const rs=rows.filter(f);return [n,fmt(mean(rs,'Q23')),fmt(mean(rs,'Q24')),fmt(mean(rs,'Q26')),fmt(mean(rs,'USP_EFFECT'))]}))}
 <h3>6 · Prioriteiten voor de website</h3>
 ${table(['Eerste verbeterpunt (Q27)','n','%'],optDist(Q('Q27'),rows))}
 <h3>7 · Samenstelling en kwaliteit</h3>
 ${table(['Kenmerk','Aantal'],[['HR',rows.filter(groups[1][1]).length],['Beslissers',rows.filter(groups[2][1]).length],['Kerndoelgroep (HR, 50–500)',rows.filter(r=>Number(r.DOELGROEP)===1).length],['Afnames in deze selectie',rows.length],['Met kwaliteitsvlag',rows.filter(r=>Number(r.KWALITEIT_VLAG)===1).length]])}
 ${table(['Wervingskanaal','Aantal'],Object.entries(rows.reduce((o,r)=>{const b=String(r.BRON||'(onbekend)');o[b]=(o[b]||0)+1;return o},{})).sort((a,b)=>b[1]-a[1]))}
 </section>`}

function adminLogin(message=''){shell(`<main class="center"><section class="welcome"><div class="eyebrow">Alleen voor onderzoekers</div><h1>${esc(ui.adminTitle)}</h1><p class="muted">${esc(ui.adminIntro)}</p><label>${esc(ui.key)}<input type="password" autocomplete="off" id="admin-key" class="keyinput"></label><button class="primary" id="admin-load">${esc(ui.login)}</button><button class="link" id="schema-export">${esc(ui.configExport)}</button><p class="status" id="admin-msg">${esc(message)}</p></section></main>`);$('#schema-export').onclick=()=>download('ResearchConfig.gs','/* Automatisch uit index.html CONFIG. Geen geheimen. */\nconst RESEARCH = '+JSON.stringify(buildSchema(),null,2)+';\n');$('#admin-load').onclick=async()=>{const key=$('#admin-key').value.trim();if(!key)return;$('#admin-load').disabled=true;$('#admin-msg').textContent='Beveiligde gegevens ophalen…';try{const data=await jsonp({action:'data',key});if(!data.ok)throw new Error(data.error||'Geen toegang');sessionStorage.setItem('research-admin-key',key);adminData=data;adminDashboard()}catch(e){$('#admin-msg').textContent=e.message;$('#admin-load').disabled=false}}}
function getFilters(){return {source:$('#filter-source')?.value||'all',persp:$('#filter-persp')?.value||'all',test:$('#filter-test')?.value||'0',segment:$('#filter-segment')?.value||'all',target:$('#filter-target')?.value||'all',device:$('#filter-device')?.value||'desktop',question:$('#filter-question')?.value||'Q14',page:$('#filter-page')?.value||'home',speed:$('#filter-speed')?.value||'all'}}
function adminDashboard(){shell(`<main class="admin"><div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><div><div class="eyebrow">Onderzoeksdashboard</div><h1>${esc(ui.adminTitle)}</h1></div><div><button class="secondary" id="refresh">Vernieuwen</button> <button class="link" id="logout">${esc(ui.logout)}</button></div></div><p class="muted">Percentages gebruiken geldige antwoorden als noemer. Testafnames staan standaard uit. Heatmaps gebruiken alleen de laatste selectie per vraag en één apparaat.</p><div class="filters"><label>Gegevens<select id="filter-test"><option value="0">Echte afnames</option><option value="1">Alleen TEST</option><option value="all">Alle afnames</option></select></label><label>Segment<select id="filter-segment"><option value="all">Alle segmenten</option><option value="1">HR</option><option value="2">Overig</option></select></label><label>Perspectief<select id="filter-persp"><option value="all">Alle perspectieven</option><option value="1">Organisatie (HR/directie)</option><option value="2">Eigen werk</option><option value="3">(Toekomstig) werk</option></select></label><label>Kerndoelgroep<select id="filter-target"><option value="all">Iedereen</option><option value="1">Kerndoelgroep</option><option value="0">Overig</option></select></label><label>Apparaat<select id="filter-device"><option value="desktop">Desktop</option><option value="mobile">Mobiel</option></select></label><label>Kwaliteit<select id="filter-speed"><option value="all">Alle afnames</option><option value="0">Zonder snelheidsvlag</option><option value="q">Zonder enige kwaliteitsvlag</option></select></label><label>Wervingskanaal<select id="filter-source"><option value="all">Alle kanalen</option>${[...new Set(adminData.respondents.map(r=>String(r.BRON||'')))].sort().map(b=>`<option value="${esc(b)}">${esc(b||'(onbekend)')}</option>`).join('')}</select></label></div><div id="dashboard-body"></div><div class="actions"><button class="secondary" id="csv-r">Respondenten.csv</button><button class="secondary" id="csv-c">Kliks.csv</button><button class="secondary" id="csv-b">Codeboek.csv</button></div><p class="muted" style="font-size:12px">Exports volgen bovenstaande filters; Codeboek blijft volledig. Een aangegeven afhaakpunt is geen werkelijk vertrek. De NPS-vraag meet een aanbevelingsintentie na korte blootstelling.</p></main>`);document.querySelectorAll('.filters select').forEach(el=>el.onchange=drawDashboard);$('#logout').onclick=()=>{sessionStorage.removeItem('research-admin-key');adminData=null;adminLogin()};$('#refresh').onclick=async()=>{try{const data=await jsonp({action:'data',key:sessionStorage.getItem('research-admin-key')||''});if(!data.ok)throw new Error('Geen toegang');adminData=data;drawDashboard()}catch{sessionStorage.removeItem('research-admin-key');adminLogin('Opnieuw inloggen nodig.')}};$('#csv-r').onclick=()=>exportCSV('Respondenten',filteredRows());$('#csv-c').onclick=()=>exportCSV('Kliks',filteredClicks(false));$('#csv-b').onclick=()=>exportCSV('Codeboek',adminData.codebook);drawDashboard()}
function filteredRows(){const f=getFilters();return adminData.respondents.filter(r=>(f.test==='all'||String(r.TEST)===f.test)&&(f.segment==='all'||String(r.SEGMENT)===f.segment)&&(f.target==='all'||String(r.DOELGROEP)===f.target)&&(f.persp==='all'||String(r.PERSPECTIEF)===f.persp)&&r.DEVICE===f.device&&(f.speed==='all'||(f.speed==='q'?Number(r.KWALITEIT_VLAG)===0:Number(r.SNELHEID_VLAG)===0))&&(f.source==='all'||String(r.BRON||'')===f.source))}
function filteredClicks(selectedOnly=true){const ids=new Set(filteredRows().map(r=>r.RESPONDENT_ID));return adminData.clicks.filter(c=>ids.has(c.RESPONDENT_ID)&&c.DEVICE===getFilters().device&&(!selectedOnly||Number(c.GESELECTEERD)===1))}
const has=(r,k)=>r[k]!==''&&r[k]!==null&&r[k]!==undefined&&Number.isFinite(Number(r[k]));
function mean(rows,key){const v=rows.filter(r=>has(r,key));return v.length?v.reduce((s,r)=>s+Number(r[key]),0)/v.length:null}
function fmt(x,n=1){return x===null?'—':Number(x).toLocaleString('nl-NL',{maximumFractionDigits:n,minimumFractionDigits:n})}
function rate(rows,key){const a=rows.filter(r=>has(r,key));return a.length?fmt(100*a.filter(r=>Number(r[key])===1).length/a.length)+'% · n='+a.length:'—'}
function metric(value,label){return `<div class="metric"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`}
function summarizeQuestion(q,rows){
 const eligibleRows=rows.filter(r=>eligible(q,r.Q04));
 const key=q.variable||q.id;
 const answered=eligibleRows.filter(r=>q.type==='multi'?q.options.some(o=>Number(r[q.prefix+o[0]])===1):(q.type==='semantic'||q.type==='matrix')?q.rows.every(x=>has(r,x[0])):has(r,key));
 const counts=q.type==='multi'?q.options.map(o=>[o[0],o[1],answered.filter(r=>Number(r[q.prefix+o[0]])===1).length]):q.type==='single'?q.options.map(o=>[o[0],o[1],answered.filter(r=>String(r[q.id])===o[0]).length]):q.type==='scale'?Array.from({length:q.max-q.min+1},(_,i)=>{const v=q.min+i;return [v,String(v),answered.filter(r=>Number(r[q.id])===v).length]}):[];
 return {eligible:eligibleRows.length,n:answered.length,missing:eligibleRows.length-answered.length,counts,texts:q.type==='open'?answered.map(r=>String(r[key])):[]}
}
function drawQuestionSummary(){const q=CONFIG.questions.find(q=>q.id===$('#summary-question').value),rows=filteredRows(),a=summarizeQuestion(q,rows);let body=`<p><strong>${esc(q.text)}</strong></p><p class="muted">Van toepassing: ${a.eligible} · beantwoord: ${a.n} · ontbrekend: ${a.missing}</p>`;
 if(a.counts.length)body+=`<div class="table-wrap"><table><thead><tr><th>Code</th><th>Antwoord</th><th>Aantal</th><th>% van beantwoord</th></tr></thead><tbody>${a.counts.map(([code,label,n])=>`<tr><td>${esc(code)}</td><td>${esc(label)}</td><td>${n}</td><td>${a.n?fmt(n/a.n*100):'—'}%</td></tr>`).join('')}</tbody></table></div>${q.type==='multi'?'<p class="muted">Meerdere antwoorden mogelijk; percentages kunnen optellen tot meer dan 100%.</p>':''}`;
 if(q.type==='matrix')body+=`<p class="muted">Perspectief verschilt per rol (PERSPECTIEF): organisatie (HR/directie), eigen werk, of (toekomstig) werk. Rapporteer per perspectief.</p><table><thead><tr><th>Onderdeel / variabele</th><th>n</th><th>Gemiddelde</th><th>1 / 2 / 3 / 4 / 5</th></tr></thead><tbody>${q.rows.map(([k,l])=>{const valid=rows.filter(x=>has(x,k));return `<tr><td>${esc(l)}<small>${esc(k)}</small></td><td>${valid.length}</td><td>${fmt(mean(valid,k))}</td><td>${[1,2,3,4,5].map(v=>valid.filter(x=>Number(x[k])===v).length).join(' / ')}</td></tr>`}).join('')}</tbody></table>`;if(q.type==='semantic')body+=`<table><thead><tr><th>Dimensie / variabele</th><th>n</th><th>Gemiddelde</th><th>1 / 2 / 3 / 4 / 5</th></tr></thead><tbody>${q.rows.map(([k,l,r])=>{const valid=rows.filter(x=>has(x,k));return `<tr><td>${esc(l+' — '+r)}<small>${esc(k)}</small></td><td>${valid.length}</td><td>${fmt(mean(valid,k))}</td><td>${[1,2,3,4,5].map(v=>valid.filter(x=>Number(x[k])===v).length).join(' / ')}</td></tr>`}).join('')}</tbody></table>`;
 if(a.texts.length)body+=`<ol class="open-answers">${a.texts.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><p class="muted">Vrije antwoorden: thematisch coderen; niet automatisch als categorie of sentiment gescoord.</p>`;
 if(['attention','click'].includes(q.type))body+='<p class="muted">Klikposities staan in Klikpatronen; toelichtingen en selectiecodes staan in de respondent-CSV.</p>';
 $('#question-summary').innerHTML=body
}
function drawDashboard(){const rows=filteredRows(),nps=rows.filter(r=>has(r,'Q24')),npsScore=nps.length?100*(nps.filter(r=>Number(r.Q24)>=9).length-nps.filter(r=>Number(r.Q24)<=6).length)/nps.length:null;const paired=rows.filter(r=>has(r,'Q23')&&has(r,'Q26'));$('#dashboard-body').innerHTML=`<div class="metrics">${metric(rows.length,'Totaal · huidige selectie')}${metric(rows.filter(r=>Number(r.SEGMENT)===1).length,'HR')}${metric(rows.filter(r=>Number(r.SEGMENT)===2).length,'Overig')}${metric(rows.filter(r=>Number(r.DOELGROEP)===1).length,'Kerndoelgroep')}${metric(rows.filter(r=>Number(r.BESLISSER)===1).length,'Beslissers')}${metric(rows.filter(r=>Number(r.AFGEROND)===1).length,'Afgerond')}${metric(fmt(mean(rows,'TO_BELANG_GEM')),'Belang talentontwikkeling · gem. Q08')}${metric(fmt(mean(rows,'Q09')),'Tevredenheid huidige aanpak · Q09')}${metric(fmt(mean(rows,'TO_GAP')),'Behoeftekloof · belang − tevredenheid')}${metric(fmt(mean(rows,'Q15')),'Duidelijkheid aanbod · Q15')}${metric(fmt(mean(rows,'Q16')),'Eerste indruk · Q16')}${metric(fmt(mean(rows,'Q20')),'Inzicht in passend aanbod · Q20')}${metric(fmt(npsScore),'Aanbevelingsindex · n='+nps.length)}${metric(fmt(mean(paired,'Q23')),'Intentie vóór · gekoppelde n='+paired.length)}${metric(fmt(mean(paired,'Q26')),'Intentie na · gekoppelde n='+paired.length)}${metric(fmt(mean(paired,'USP_EFFECT')),'Gemiddelde verandering')}</div><section class="panel"><h2>Verandering per conditie</h2><p class="muted">Alleen respondenten met zowel Q23 als Q26. Vergelijking is verkennend; controleer groepsgrootte en uitval.</p><div class="table-wrap"><table><thead><tr><th>Conditie</th><th>n</th><th>Vóór</th><th>Na</th><th>USP_EFFECT</th></tr></thead><tbody>${[1,2].map(c=>{const r=paired.filter(r=>Number(r.CONDITIE)===c);return `<tr><td>${esc(CONFIG.labels.CONDITIE[c])}</td><td>${r.length}</td><td>${fmt(mean(r,'Q23'))}</td><td>${fmt(mean(r,'Q26'))}</td><td>${fmt(mean(r,'USP_EFFECT'))}</td></tr>`}).join('')}</tbody></table></div><p>Verschil in gemiddelde verandering (claim − controle): <strong>${fmt(mean(paired.filter(r=>Number(r.CONDITIE)===1),'USP_EFFECT')===null||mean(paired.filter(r=>Number(r.CONDITIE)===2),'USP_EFFECT')===null?null:mean(paired.filter(r=>Number(r.CONDITIE)===1),'USP_EFFECT')-mean(paired.filter(r=>Number(r.CONDITIE)===2),'USP_EFFECT'))}</strong></p></section><section class="panel" style="margin-top:20px"><h2>Aangegeven afhaakpunt · Q19</h2><div id="drop-table"></div><h2 style="margin-top:25px">Onvoltooide afnames</h2><p class="muted">Laatst bereikte vraag; de respondent kan later nog terugkomen.</p><div id="actual-drop"></div></section><section class="panel" style="margin-top:20px"><h2>Klikpatronen · ${getFilters().device==='mobile'?'mobiel':'desktop'}</h2><label>Websitepagina<select id="filter-page" class="keyinput"><option value="home">Homepage</option><option value="product">Productpagina</option></select></label><label>Klikvraag<select id="filter-question" class="keyinput"><option value="Q14">Q14 · eerste aandacht</option><option value="Q18">Q18 · uitnodigend onderdeel</option><option value="Q19">Q19 · aangegeven vertrekpunt</option></select></label><p class="status" id="heat-count"></p><div class="heatbox"><div class="heat" id="heat"><img id="heat-img" alt="Screenshot met klikpatronen"><canvas id="heat-canvas" aria-label="Heatmap"></canvas></div></div></section>`;$('#dashboard-body').insertAdjacentHTML('beforeend',insightsHTML(rows));$('#dashboard-body').insertAdjacentHTML('beforeend',`<section class="panel" style="margin-top:24px"><h2>Antwoorden per vraag</h2><label>Vraag<select id="summary-question">${CONFIG.questions.map(q=>`<option value="${q.id}">${q.id} · ${esc(q.text)}</option>`).join('')}</select></label><div id="question-summary"></div></section>`);$('#summary-question').onchange=drawQuestionSummary;drawQuestionSummary();const drops={};rows.forEach(r=>{if(Number(r.Q19_NIET_AFHAKEN)===1)drops['Ik zou niet afhaken']=(drops['Ik zou niet afhaken']||0)+1;else if(r.Q19_SECTIE)drops[r.Q19_SECTIE]=(drops[r.Q19_SECTIE]||0)+1});const actual={};rows.filter(r=>Number(r.AFGEROND)!==1).forEach(r=>actual[r.LAATSTE_VRAAG]=(actual[r.LAATSTE_VRAAG]||0)+1);const table=o=>Object.keys(o).length?`<table><thead><tr><th>Antwoord / scherm</th><th>Aantal</th></tr></thead><tbody>${Object.entries(o).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</tbody></table>`:`<p class="muted">${esc(ui.empty)}</p>`;$('#drop-table').innerHTML=table(drops);$('#actual-drop').innerHTML=table(actual);$('#filter-question').onchange=()=>{const first=$('#filter-question').value==='Q14';$('#filter-page').disabled=first;if(first)$('#filter-page').value='home';drawHeatmap()};$('#filter-page').onchange=drawHeatmap;$('#filter-page').disabled=true;drawHeatmap()}
function drawHeatmap(){const f=getFilters(),im=$('#heat-img'),canvas=$('#heat-canvas'),v=CONFIG.pages[f.page][f.device],clicks=filteredClicks().filter(c=>c.VRAAG===f.question&&c.PAGINA===f.page);$('#heat-count').textContent=clicks.length+' geselecteerde klikken · '+(f.device==='mobile'?'mobiel':'desktop')+' · '+(f.page==='home'?'homepage':'productpagina');im.onload=()=>{const w=Math.min(1100,v.width),h=Math.round(w*v.height/v.width);canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);if(!clicks.length)return;const off=document.createElement('canvas');off.width=w;off.height=h;const c=off.getContext('2d');c.filter='blur(12px)';clicks.forEach(p=>{c.beginPath();c.fillStyle='rgba(0,0,0,.32)';c.arc(Number(p.X)/100*w,Number(p.Y)/100*h,20,0,Math.PI*2);c.fill()});const pixels=c.getImageData(0,0,w,h),d=pixels.data;let max=1;for(let i=3;i<d.length;i+=4)max=Math.max(max,d[i]);for(let i=0;i<d.length;i+=4){const a=d[i+3]/max;if(a<.025){d[i+3]=0;continue}d[i]=Math.round(255*Math.min(1,a*2));d[i+1]=Math.round(220*(1-Math.abs(a-.5)*2));d[i+2]=Math.round(255*Math.max(0,1-a*2));d[i+3]=Math.round(Math.min(.8,a)*255)}ctx.putImageData(pixels,0,0)};im.src=v.src;if(im.complete)im.onload()}
function exportCSV(name,rows){const keys=rows.length?Object.keys(rows[0]):name==='Respondenten'?Object.keys(buildSchema().fields):[];const safe=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};download(name+'.csv','\ufeff'+[keys,...rows.map(r=>keys.map(k=>r[k]))].map(row=>row.map(safe).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
if(IS_ADMIN){adminLogin();const key=sessionStorage.getItem('research-admin-key');if(key){$('#admin-key').value=key;$('#admin-load').click()}}else welcome();
</script></body></html>
